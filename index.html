<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Mvmnt Tribe — Weekend Runs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111111;
      --surface: #1a1a1a;
      --surface-2: #1f1f1f;
      --border: #252525;
      --border-2: #2a2a2a;
      --border-3: #333333;
      --text-primary: #ffffff;
      --text-secondary: #888888;
      --text-muted: #555555;
      --text-faint: #333333;
    }

    html, body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* HERO */
    .hero {
      background: var(--surface);
      padding: 32px 20px 28px;
      border-bottom: 1px solid var(--border-2);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50px; right: -20px;
      width: 180px; height: 180px;
      background: #1e1e1e;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 10px; right: 70px;
      width: 90px; height: 90px;
      background: #222222;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }

    .hero-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .logo-svg { width: 38px; height: 38px; }

    .hero-brand {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .hero-main { position: relative; z-index: 1; }

    .hero-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .hero-title span {
      display: block;
      font-size: 30px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-top: 2px;
    }

    .hero-tagline {
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-faint);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* STATS BAR */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border-2);
    }

    .stat {
      padding: 16px 0;
      text-align: center;
      border-right: 1px solid var(--border-2);
    }

    .stat:last-child { border-right: none; }

    .stat-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 3px;
    }

    /* MILESTONES */
    .milestones {
      padding: 16px 16px 4px;
      display: flex;
      gap: 10px;
    }

    .milestone-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .milestone-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #222;
      border: 1.5px solid var(--border-3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .milestone-icon svg { width: 18px; height: 18px; }

    .milestone-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-primary);
    }

    .milestone-km {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* SECTION HEADER */
    .section-header {
      padding: 20px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .season-tag {
      font-size: 11px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* LEADERBOARD */
    .leaderboard {
      padding: 0 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .runner-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px 14px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.4s ease forwards;
    }

    .runner-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--border-3);
      border-radius: 14px 0 0 14px;
    }

    .runner-card.rank-1::before { background: #aaaaaa; }
    .runner-card.rank-2::before { background: #777777; }
    .runner-card.rank-3::before { background: #555555; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .rank-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-faint);
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .rank-1 .rank-num { color: #aaa; }
    .rank-2 .rank-num { color: #777; }
    .rank-3 .rank-num { color: #555; }

    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #222;
      border: 1.5px solid var(--border-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .runner-info { flex: 1; min-width: 0; }

    .runner-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #e8e8e8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .runner-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .progress-track {
      flex: 1;
      height: 3px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--text-muted);
      border-radius: 2px;
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }

    .rank-1 .progress-fill { background: #999; }
    .rank-2 .progress-fill { background: #777; }

    .progress-pct {
      font-size: 10px;
      color: var(--text-faint);
      flex-shrink: 0;
      width: 28px;
      text-align: right;
    }

    .runner-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 2px 7px;
    }

    .next-target {
      margin-top: 5px;
      font-size: 10px;
      color: var(--text-faint);
    }

    .runner-km {
      text-align: right;
      flex-shrink: 0;
    }

    .km-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
    }

    .km-label {
      font-size: 9px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
    }

    /* LOADING & ERROR */
    .state-msg {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .loader {
      width: 22px; height: 22px;
      border: 2px solid #2a2a2a;
      border-top-color: #666;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* FOOTER */
    .footer {
      padding: 20px 16px;
      border-top: 1px solid #1a1a1a;
      text-align: center;
    }

    .footer-text {
      font-size: 10px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .last-updated {
      font-size: 10px;
      color: #272727;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-top">
        <svg class="logo-svg" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="5,75 22,75 13,52" fill="#777"/>
          <polygon points="20,75 60,75 40,25" fill="#aaa"/>
          <polygon points="58,75 85,75 72,48" fill="#666"/>
        </svg>
        <span class="hero-brand">Mvmnt Tribe</span>
      </div>
      <div class="hero-main">
        <div class="hero-title">
          Weekend
          <span>Runs</span>
        </div>
        <div class="hero-tagline">Let's get stronger together</div>
      </div>
    </div>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-num" id="stat-runners">—</div>
        <div class="stat-label">Runners</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-km">—</div>
        <div class="stat-label">Total KM</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-badges">—</div>
        <div class="stat-label">Badges</div>
      </div>
    </div>

    <!-- MILESTONES -->
    <div class="milestones">
      <div class="milestone-card">
        <div class="milestone-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="7" r="4" stroke="#777" stroke-width="1.5"/>
            <path d="M7 13l-2 9M17 13l2 9M9 22h6" stroke="#777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="milestone-name">Pacer</div>
          <div class="milestone-km">25 km milestone</div>
        </div>
      </div>
      <div class="milestone-card">
        <div class="milestone-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" stroke="#666" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="milestone-name">Strider</div>
          <div class="milestone-km">50 km milestone</div>
        </div>
      </div>
    </div>

    <!-- LEADERBOARD -->
    <div class="section-header">
      <span class="section-title">Leaderboard</span>
      <span class="season-tag">Season 1 · 2026</span>
    </div>

    <div class="leaderboard" id="leaderboard">
      <div class="state-msg">
        <div class="loader"></div>
        Loading runners...
      </div>
    </div>

    <div class="footer">
      <div class="footer-text">Run Together. Grow Together. — Est. 2026</div>
      <div class="last-updated" id="last-updated"></div>
    </div>

  </div>

  <script>
    // ─── CONFIGURATION ───────────────────────────────────────────────
    // After publishing your Google Sheet as CSV, paste the URL below.
    // See README.md for exact steps to get this URL.
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhKY34HL4RXIHkhSS8iH3rcIXYRIeNjt7iGTebXhB9s-FGbP0H7goIHYeGd7QgokDtAHPQCI1bjKbg/pub?gid=0&single=true&output=csv';
    // ─────────────────────────────────────────────────────────────────

    function getInitials(name) {
      return name.trim().split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    }

    function getMilestone(km) {
      if (km >= 50) return 'Strider';
      if (km >= 25) return 'Pacer';
      return null;
    }

    function getNextTarget(km) {
      if (km < 25) return `${25 - km} km to Pacer`;
      if (km < 50) return `${50 - km} km to Strider`;
      return 'All milestones achieved';
    }

    function getProgress(km) {
      if (km >= 50) return 100;
      if (km >= 25) return Math.round(((km - 25) / 25) * 100);
      return Math.round((km / 25) * 100);
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
      return lines.slice(1).map(line => {
        const values = line.split(',').map(v => v.trim().replace(/"/g, ''));
        const obj = {};
        headers.forEach((h, i) => obj[h] = values[i] || '');
        return obj;
      });
    }

    async function loadLeaderboard() {
      const board = document.getElementById('leaderboard');

      if (!SHEET_CSV_URL || SHEET_CSV_URL === 'YOUR_GOOGLE_SHEET_CSV_URL_HERE') {
        board.innerHTML = `<div class="state-msg">⚙️ Setup needed — paste your Google Sheet CSV URL into index.html.<br><br>See README.md for instructions.</div>`;
        return;
      }

      try {
        const res = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error('Failed to fetch sheet');
        const text = await res.text();
        const rows = parseCSV(text);

        // Filter active runners and parse KMs
        const runners = rows
          .filter(r => r['Name'] && r['Name'].trim() !== '')
          .map(r => ({
            name: r['Name'].trim(),
            km: parseFloat(r['Total KMs']) || 0,
            runs: parseInt(r['Runs Completed']) || 0,
          }))
          .sort((a, b) => b.km - a.km);

        const totalKm = runners.reduce((s, r) => s + r.km, 0);
        const totalBadges = runners.filter(r => r.km >= 25).length;

        document.getElementById('stat-runners').textContent = runners.length;
        document.getElementById('stat-km').textContent = totalKm;
        document.getElementById('stat-badges').textContent = totalBadges;

        board.innerHTML = '';

        if (runners.length === 0) {
          board.innerHTML = '<div class="state-msg">No runners yet. Be the first!</div>';
          return;
        }

        runners.forEach((runner, i) => {
          const rank = i + 1;
          const rankClass = rank <= 3 ? `rank-${rank}` : '';
          const milestone = getMilestone(runner.km);
          const progress = getProgress(runner.km);

          const card = document.createElement('div');
          card.className = `runner-card ${rankClass}`;
          card.style.animationDelay = `${i * 60}ms`;

          card.innerHTML = `
            <div class="rank-num">${rank}</div>
            <div class="avatar">${getInitials(runner.name)}</div>
            <div class="runner-info">
              <div class="runner-name">${runner.name}</div>
              <div class="runner-progress">
                <div class="progress-track">
                  <div class="progress-fill" data-pct="${progress}"></div>
                </div>
                <div class="progress-pct">${progress}%</div>
              </div>
              ${milestone
                ? `<div class="runner-badge">${milestone}</div>`
                : `<div class="next-target">${getNextTarget(runner.km)}</div>`
              }
            </div>
            <div class="runner-km">
              <div class="km-value">${runner.km}</div>
              <div class="km-label">km</div>
            </div>
          `;

          board.appendChild(card);
        });

        requestAnimationFrame(() => {
          document.querySelectorAll('.progress-fill').forEach(el => {
            el.style.width = el.dataset.pct + '%';
          });
        });

        const now = new Date();
        document.getElementById('last-updated').textContent =
          `Updated ${now.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}`;

      } catch (err) {
        board.innerHTML = '<div class="state-msg">Could not load data. Check your sheet URL and make sure it is published publicly.</div>';
        console.error(err);
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>
